name: Release

# Pushing a tag vX.Y.Z makes a GitHub release: it checks the tag against
# Cargo.toml and CHANGELOG.md, runs the tests, builds the binaries and
# publishes them with that version's changelog section as notes, then
# publishes the crate to crates.io through Trusted Publishing (no stored
# token). For a tag pushed before this workflow existed, run it by hand
# with the tag name. See docs/ci.md and docs/versioning.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is vX.Y.Z on main
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          fi
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main || {
            echo "::error::$TAG is not on main"
            exit 1
          }
      # The script comes from this workflow's commit, so a tag made before
      # it existed can still be checked; Cargo.toml and CHANGELOG.md come
      # from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - name: The tag matches Cargo.toml and CHANGELOG.md
        run: .release-tools/scripts/release_notes.sh "$TAG" .
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl binary: runs on any x86_64 Linux, whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache here: a release is built from scratch.
      - run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="gdtest-runner-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/gdtest-runner" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE reporter/gdtest_reporter.gd "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .release-tools/scripts/release_notes.sh "$TAG" . > notes.md
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "${prerelease[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "gdtest-runner ${TAG#v}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS

  # The last step, because a crates.io version can never be replaced. It
  # authenticates with Trusted Publishing: crates.io trusts this repository,
  # this workflow file and the `crates-io` environment (set up once in the
  # crate's settings on crates.io), and hands out a short-lived token.
  crates-io:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Is this version for crates.io?
        id: plan
        run: |
          version=${TAG#v}
          publish=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -c '.packages[] | select(.name == "gdtest-runner") | .publish')
          if [[ $publish == "[]" ]]; then
            echo "::notice::Cargo.toml at $TAG has publish = false: not published to crates.io"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "gdtest-runner release workflow (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/gdtest-runner/$version")
          case $status in
            200)
              echo "::notice::gdtest-runner $version is already on crates.io: not published again"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered HTTP $status for gdtest-runner $version"
              exit 1
              ;;
          esac
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.plan.outputs.publish == 'true'
        id: auth
      - if: steps.plan.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
